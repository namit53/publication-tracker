<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${publication.title + ' | University Publication Tracker'}">Publication details</title><link rel="stylesheet" th:href="@{/css/site.css}"></head>
<body><div th:replace="~{fragments :: siteHeader}"></div><main class="page-shell"><div class="detail-column"><a class="back-link" th:href="${backUrl}">&larr; Back to results</a><a class="back-link" th:if="${isAdmin}" th:href="@{/admin/{id}/edit(id=${publication.id})}">Edit</a><article class="detail-card"><h1 th:text="${publication.title}">Publication title</h1><dl class="detail-meta"><div><dt>Year</dt><dd th:text="${publication.year > 0 ? publication.year : 'Not available'}">2025</dd></div><div><dt>Journal</dt><dd th:text="${publication.journal != null and !publication.journal.isBlank() ? publication.journal : 'Not available'}">Journal</dd></div><div><dt>Citations</dt><dd th:text="${publication.citations}">0</dd></div></dl><dl><div class="detail-field"><dt>Authors</dt><dd th:text="${publication.authors != null and !publication.authors.isBlank() ? publication.authors : 'Not available'}">Authors</dd></div><div class="detail-field"><dt>Department</dt><dd th:text="${publication.department != null and !publication.department.isBlank() ? publication.department : 'Unassigned'}">Unassigned</dd></div><div class="detail-field"><dt>DOI</dt><dd th:if="${publication.doi != null and !publication.doi.isBlank()}"><a target="_blank" rel="noopener noreferrer" th:href="${'https://doi.org/' + publication.doi}" th:text="${publication.doi}">DOI</a></dd><dd th:unless="${publication.doi != null and !publication.doi.isBlank()}">Not available</dd></div></dl>
<form th:if="${isAdmin}" method="post" th:action="@{/admin/{id}/department(id=${publication.id})}">
  <p class="notice success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
  <p class="notice error" role="alert" th:if="${departmentError}" th:text="${departmentError}"></p>
  <label for="department">Change department</label>
  <select class="select" id="department" name="department">
    <option value="">Unassigned</option>
    <option th:each="choice : ${departmentChoices}" th:value="${choice.name}"
            th:text="${choice.name}" th:selected="${choice.name == publication.department}"></option>
  </select>
  <button class="button" type="submit">Save department</button>
</form>
</article></div></main><div th:replace="~{fragments :: siteFooter}"></div></body></html>
