spring.application.name=tracker
server.port=${PORT:8080}

# H2 is used by default for local development and tests. Set the SPRING_DATASOURCE_*
# environment variables to connect to PostgreSQL in deployed environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Create or update tables from the JPA entity model.
spring.jpa.hibernate.ddl-auto=update

openalex.institution-id=${OPENALEX_INSTITUTION_ID:I5847235}
openalex.base-url=${OPENALEX_BASE_URL:https://api.openalex.org}
openalex.per-page=${OPENALEX_PER_PAGE:100}
